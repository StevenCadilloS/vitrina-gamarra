<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vitrina Gamarra</title>
  <meta name="description" content="Busca prendas en las galerías de Gamarra, ubica el stand en el plano y escribe a la tienda por WhatsApp.">

  <!-- Vista previa al compartir en LinkedIn, WhatsApp, etc.
       Después de publicar, cambia TU-PROYECTO.vercel.app por tu dominio real. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Vitrina Gamarra">
  <meta property="og:description" content="Busca la prenda, encuentra el stand y escribe a la tienda. Prototipo con dos galerías de Gamarra.">
  <meta property="og:image" content="https://TU-PROYECTO.vercel.app/img/og-cover.png">
  <meta property="og:url" content="https://TU-PROYECTO.vercel.app/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Analítica: activa "Web Analytics" en el panel de Vercel y quita el comentario de la línea siguiente. -->
  <!-- <script defer src="/_vercel/insights/script.js"></script> -->
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>Vitrina <span>Gamarra</span></b><small>Encuentra la prenda, llega al stand</small></div>
    <form class="search" id="searchForm" role="search">
      <input id="q" type="search" placeholder="¿Qué buscas? Ej: polo oversize, jean mom, casaca" aria-label="Buscar prendas o tiendas" autocomplete="off">
      <button type="submit">Buscar</button>
    </form>
  </div>
</header>
<div class="demo-note" id="demoNote" hidden><div class="wrap">Prototipo con datos de ejemplo: las galerías, tiendas, precios y números son ficticios.</div></div>

<section class="wrap controls">
  <div class="row" id="cats"></div>
  <div class="row" id="sales"></div>
</section>

<main class="wrap">
  <section class="panel" aria-label="Plano de galería">
    <div class="gal-tabs" role="tablist" id="galTabs"></div>
    <div class="plan-head">
      <div><h2 id="galName"></h2><p id="galAddr"></p><a class="maps" id="mapsLink" href="#" target="_blank" rel="noopener">Ver en Google Maps ↗</a></div>
      <div class="floors" id="floors" aria-label="Pisos"></div>
    </div>
    <div class="plan-svg" id="plan"></div>
    <div class="legend">
      <span><i style="background:var(--tag);border-color:var(--tag)"></i>Coincide con tu búsqueda</span>
      <span><i style="background:var(--surface)"></i>Tienda registrada</span>
      <span><i style="background:var(--empty)"></i>Stand aún no registrado</span>
    </div>
  </section>

  <section class="panel" aria-label="Resultados">
    <div class="results-head"><h2 id="resTitle">Tiendas</h2><span id="resCount"></span></div>
    <div class="list" id="list"></div>
  </section>
</main>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dName"></aside>
<div class="toast" id="toast" hidden role="status"></div>

<script src="js/data.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
